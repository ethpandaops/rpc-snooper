name: goreleaser

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  goreleaser:
    name: "Build binaries & GitHub release"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Derive release suffix from tag (if it exists)
        run: |
          # Strip the 'refs/tags/' prefix
          TAG_NAME=${GITHUB_REF#refs/tags/}

          # Extract suffix from tag name after the last '-' (e.g., 'dencun' from 'v1.0.0-dencun')
          RELEASE_SUFFIX=${TAG_NAME##*-}

          # Check if the suffix is still a version pattern (e.g., 'v0.0.44'), in which case there's no suffix
          if [[ $RELEASE_SUFFIX =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_SUFFIX=""
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_SUFFIX=$RELEASE_SUFFIX" >> $GITHUB_ENV

          echo "Release suffix: $RELEASE_SUFFIX"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.25.x
      - name: Run apt-get update
        run: sudo apt-get update
      - name: Install make
        run: sudo apt-get -y install make
      - name: Update GoReleaser config
        run: |
          cp .goreleaser.yaml ../.goreleaser.yaml.new

          # If we have a RELEASE_SUFFIX, update the goreleaser config to not set
          # the release as the latest
          if [[ -n "$RELEASE_SUFFIX" ]]; then
            echo "release:" >> ../.goreleaser.yaml.new
            echo "  prerelease: true" >> ../.goreleaser.yaml.new
            echo "  make_latest: false" >> ../.goreleaser.yaml.new
          fi
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config ../.goreleaser.yaml.new
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SUFFIX: ${{ env.RELEASE_SUFFIX }}

  dockerinfo:
    name: "Resolve docker tags"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      latest_tag: ${{ steps.info.outputs.latest_tag }}
    steps:
      - name: Resolve tags
        id: info
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          # goreleaser strips the leading 'v' for image tags; match that here
          version="${tag_name#v}"
          release_suffix="${tag_name##*-}"
          if [[ "$release_suffix" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_suffix=""
          fi
          if [[ -n "$release_suffix" ]]; then
            latest_tag="${release_suffix}-latest"
          else
            latest_tag="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "resolved version=$version latest_tag=$latest_tag"

  build_amd64_docker_image:
    name: "Build amd64 docker image"
    needs: [dockerinfo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push amd64 docker image
      env:
        DOCKER_REPO: "ethpandaops/rpc-snooper"
        VERSION: ${{ needs.dockerinfo.outputs.version }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        docker buildx build . \
          --file Dockerfile \
          --platform linux/amd64 \
          --build-arg release="${TAG_NAME}" \
          --tag "${DOCKER_REPO}:${VERSION}-amd64" \
          --push

  build_arm64_docker_image:
    name: "Build arm64 docker image"
    needs: [dockerinfo]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push arm64 docker image
      env:
        DOCKER_REPO: "ethpandaops/rpc-snooper"
        VERSION: ${{ needs.dockerinfo.outputs.version }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        docker buildx build . \
          --file Dockerfile \
          --platform linux/arm64 \
          --build-arg release="${TAG_NAME}" \
          --tag "${DOCKER_REPO}:${VERSION}-arm64" \
          --push

  build_multiarch_image:
    name: "Build multiarch docker manifest"
    needs: [dockerinfo, build_amd64_docker_image, build_arm64_docker_image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # combine the natively-built per-arch images into the version + latest tags
    - name: Create multiarch manifests
      env:
        DOCKER_REPO: "ethpandaops/rpc-snooper"
        VERSION: ${{ needs.dockerinfo.outputs.version }}
        LATEST_TAG: ${{ needs.dockerinfo.outputs.latest_tag }}
      run: |
        docker buildx imagetools create \
          -t "${DOCKER_REPO}:${VERSION}" \
          -t "${DOCKER_REPO}:${LATEST_TAG}" \
          "${DOCKER_REPO}:${VERSION}-amd64" \
          "${DOCKER_REPO}:${VERSION}-arm64"
